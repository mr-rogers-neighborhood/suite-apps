appId: run.suite.sync
productName: Suite Sync
# The binary is the relay the rest of the suite already looks for, and the Flatpak exposes a
# `suite-sync` launcher that runs the same file as its Node runtime.
executableName: suite-sync
copyright: Copyright © Suite contributors

directories:
  # Outside `services/relay` on purpose. The app depends on `@suite/sync-server`, whose package root
  # is `services/relay`, so an output inside it is copied back in as a dependency. This path can never
  # be an input to the build it holds.
  output: ../../../.artifacts/sync-app
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.map"
  # electron-builder copies a workspace dependency's whole directory. The relay needs only the
  # server's `dist` and runtime dependencies, not the Electron shell, sources, tests or docs that
  # live beside it. `scripts/check-package.mjs` fails the package if this regresses.
  - "!node_modules/@suite/sync-server/{app,docs,deploy,packages,scripts,src}/**"

asar: true

# Only Chromium's US English locale ships. Nothing in the tree has an i18n
# framework or a translated string, so every other `locales/*.pak` was dead
# weight; `en-US.pak` stays because it is Chromium's fallback.
electronLanguages:
  - en-US

# The switches an attacker cannot turn back on after packaging.
electronFuses:
  # This app has two entry points. The window is the app; the other is the relay on an
  # always-on machine, reached with `flatpak run --command=suite-sync`, and the Flatpak base
  # carries no Node of its own to run it with. `ELECTRON_RUN_AS_NODE=1` makes this binary that
  # runtime. The fuse is on deliberately and only for the CLI launcher beside it.
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

extraResources:
  - from: build/icon.png
    to: icon.png
  # A panel draws the tray item, so it is its own small image rather than the 512px app icon.
  - from: build/tray.png
    to: tray.png

linux:
  syncDesktopName: true
  # Linux ships as a Flatpak. `scripts/flatpak.mjs` packages this unpacked build, so `dir`
  # is the only target configured here.
  target:
    - dir
  category: Network
  synopsis: Your own Suite relay, in the tray
  # Neither an account nor a service: the relay is a mailbox on a machine you own.
  description: Keeps a Suite relay running in the tray and shows the address and code another device needs.
