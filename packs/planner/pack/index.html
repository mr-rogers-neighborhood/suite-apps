<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      A pack that does not declare `network` has to prove it cannot reach one. `default-src 'self'`
      matters as much as `connect-src`: the other fetch directives inherit from it, so without it an
      `<img src="https://…">` would be an exfiltration channel that connect-src does not close.
      `connect-src 'self'` rather than 'none' because wasm-bindgen fetches Loro's `.wasm` same-origin
      — measured in the Conformance pack: 'none' blanks the frame. 'self' still cannot reach a
      remote origin. `wasm-unsafe-eval` is Loro; `style-src` keeps the inline allowance the theme
      writes before first paint.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>Suite Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The prelude, not the app: `main.ts` installs `window.suitePlanner` from the host's
      `window.suite`, then imports the renderer. `bootDocument()` reads that global at import time,
      so the order is the whole entry.
    -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
