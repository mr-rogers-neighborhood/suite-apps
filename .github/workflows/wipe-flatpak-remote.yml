# TEMPORARY: one-time fresh-start wipe for the Desk rename. Remove after use.
#
# Suite Desk's new Flatpak ids (`run.suite.desk` and `run.suite.<channel>.desk`)
# are a fresh application identity rather than an update of `run.suite.shell`.
# This workflow empties the signed Flatpak remote once so the retired shell refs,
# releases and catalogue index stop being served. It builds nothing and runs
# only when a person types `wipe` in the dispatch input.
#
# Delete this workflow after the wipe; the normal release workflow is the only
# publisher the remote should have.
name: wipe-flatpak-remote

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "wipe" to delete every object in the Flatpak remote bucket
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  wipe:
    name: wipe-flatpak-remote
    # A dispatch with any other answer is a no-op, not a failed job.
    if: inputs.confirm == 'wipe'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check the wipe configuration
        env:
          ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          BUCKET: ${{ vars.SUITE_FLATPAK_S3_BUCKET }}
          DISTRIBUTION: ${{ vars.SUITE_FLATPAK_CLOUDFRONT_DISTRIBUTION }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ROLE_ARN}" ] || missing+=("repository variable AWS_RELEASE_ROLE_ARN")
          [ -n "${BUCKET}" ] || missing+=("SUITE_FLATPAK_S3_BUCKET")
          [ -n "${DISTRIBUTION}" ] || missing+=("SUITE_FLATPAK_CLOUDFRONT_DISTRIBUTION")
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'The wipe needs:\n'
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          role-session-name: suite-wipe-flatpak-remote
          aws-region: ${{ vars.AWS_RELEASE_REGION || 'us-east-1' }}

      - name: Empty the Flatpak remote and invalidate CloudFront
        env:
          BUCKET: ${{ vars.SUITE_FLATPAK_S3_BUCKET }}
          DISTRIBUTION: ${{ vars.SUITE_FLATPAK_CLOUDFRONT_DISTRIBUTION }}
        run: |
          set -euo pipefail

          count_objects() {
            aws s3 ls "s3://${BUCKET}" --recursive --summarize \
              | awk '/Total Objects:/ { count = $3 } END { print count + 0 }'
          }

          before="$(count_objects)"
          echo "bucket ${BUCKET}: ${before} object(s) before the wipe"
          aws s3 rm "s3://${BUCKET}" --recursive
          after="$(count_objects)"
          echo "bucket ${BUCKET}: ${after} object(s) after the wipe"

          invalidation="$(aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION}" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"
          echo "CloudFront invalidation ${invalidation} requested for /*"
