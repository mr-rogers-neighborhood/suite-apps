name: release-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Token and release write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions'
          gh api "repos/${GITHUB_REPOSITORY}/releases" -X POST \
            -f tag_name="probe-$GITHUB_RUN_ID" \
            -f name="probe-$GITHUB_RUN_ID" \
            -f draft=true \
            -f target_commitish="$GITHUB_SHA"
