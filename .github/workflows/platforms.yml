# The Tier 2 platform builds: unsigned Windows x64 and macOS arm64 zips of the
# Suite Shell, plus an SBOM and provenance for each. They are test artifacts,
# not releases (delivery.md, D8.1): no signing, no notarization, no dmg, no
# installer, no publication. A failure here blocks that platform's artifact,
# not the Linux release (platforms.md, P2.3).
#
# Half an hour after the 02:00 nightly, so the two runs do not overlap. There is
# deliberately no `pull_request` trigger: this is not a per-change check, and a
# fork never gets this compute (ci.md, C2.4).
#
# The tree has no Xcode project, so there is no `ios` job: apps/go is Capacitor
# with only the `android/` platform, and apps/shell is Electron. The simulator
# row stays unbuilt until that project exists (platforms.md, section 4).
name: platforms

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms
  cancel-in-progress: false

jobs:
  windows-x64:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the shared libraries and the shell
        run: pnpm --filter @suite/shell build:all
      # Unsigned zip, per platforms.md section 4: no NSIS installer, no
      # Authenticode, no auto-update. `directories.output` is `release`, so the
      # artifact lands in apps/shell/release.
      - name: Package the unsigned Windows zip
        run: pnpm --filter @suite/shell exec electron-builder --win zip
      - name: SBOM
        run: pnpm sbom --sbom-format spdx --out suite-shell-windows-x64.spdx.json
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/shell/release/*.zip
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          sbom-path: suite-shell-windows-x64.spdx.json
          subject-path: apps/shell/release/*.zip
      - name: Upload the test artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-shell-windows-x64-unsigned
          path: |
            apps/shell/release/*.zip
            suite-shell-windows-x64.spdx.json
          retention-days: 14
          if-no-files-found: error

  macos-arm64:
    name: macos-arm64
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    # No Developer ID and no notarization (platforms.md, section 7). Signing is
    # off by environment, so a runner that happens to hold an identity in its
    # keychain cannot sign a test build.
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the shared libraries and the shell
        run: pnpm --filter @suite/shell build:all
      # `--mac zip` because a dmg needs a signing/notarization story this build
      # does not have; the arch is the runner's own arm64.
      - name: Package the unsigned macOS zip
        run: pnpm --filter @suite/shell exec electron-builder --mac zip
      - name: SBOM
        run: pnpm sbom --sbom-format spdx --out suite-shell-macos-arm64.spdx.json
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/shell/release/*.zip
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          sbom-path: suite-shell-macos-arm64.spdx.json
          subject-path: apps/shell/release/*.zip
      - name: Upload the test artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-shell-macos-arm64-unsigned
          path: |
            apps/shell/release/*.zip
            suite-shell-macos-arm64.spdx.json
          retention-days: 14
          if-no-files-found: error
