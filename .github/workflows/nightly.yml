# Nightly proof: the full gate with e2e, then the two artifacts that carry this
# repository's installs.
#
# The first job asks GitHub whether this run's tag is already published. A
# published release is immutable, so a second nightly on the same day has no
# artifact it may add and no tag it may move; it prints one sentence and stops
# before the gate, green. A manual dispatch that deliberately wants another
# artifact for the day names the tag date (`date`, below), and the check then
# asks about that tag instead — never the default.
#
# While `NIGHTLY_PUBLISH` is unset, this builds the debug APK and an unsigned
# Flatpak bundle and attests them without touching a channel. Set the repository
# variable to `true` once the `release` environment holds its keys, and the run
# switches to `release.yml`: the same full gate, the release-signed APK and the
# signed Flatpak, published to the nightly channel without a reviewer (D3.2).
#
# A failure opens or updates one issue instead of a new one per night (C10.1).
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: >-
          Tag date for a deliberate second publication (YYYY-MM-DD). Empty asks
          about today's tag and stops early when it is already published.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # The question that costs no build minutes. A published release locks its tag,
  # assets and body, so there is nothing a second run could do with them; the
  # answer is a skip, not a failure after the gate.
  published:
    name: already-published
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Ask whether this run's tag is already published
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One sentence when it is published; nothing when the tag is free. The
          # tag date is the dispatch `date` input when named, today otherwise.
          sentence="$(node scripts/release-status.mjs --check-published --channel nightly)"
          if [ -z "${sentence}" ]; then
            echo "No published release for this run's tag; continuing to the gate."
            exit 0
          fi
          printf '%s\n' "${sentence}"
          printf '%s\n' "${sentence}" >> "${GITHUB_STEP_SUMMARY}"
          echo "published=true" >> "${GITHUB_OUTPUT}"

  gate:
    name: nightly-gate
    needs: published
    if: vars.NIGHTLY_PUBLISH != 'true' && needs.published.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version="$(node -e 'console.log(require("./legacy/canvas/node_modules/@playwright/test/package.json").version)')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Playwright browser (Canvas stories)
        run: pnpm --filter @suite/canvas exec playwright install --with-deps chromium
      - name: Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Fresh gate with e2e
        run: node scripts/gate.mjs --fresh

  package-linux:
    name: package-linux
    needs: [published, gate]
    if: vars.NIGHTLY_PUBLISH != 'true' && needs.published.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Flatpak tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - name: Flatpak runtimes
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08
      - name: Build the host Flatpak (nightly branch)
        env:
          SUITE_FLATPAK_REPO: ${{ github.workspace }}/.nightly/flatpak-repo
        run: node scripts/flatpak.mjs --app desk --channel nightly --no-install
      - name: Bundle
        run: |
          flatpak build-bundle "$GITHUB_WORKSPACE/.nightly/flatpak-repo" suite-desk-nightly.flatpak \
            run.suite.nightly.desk nightly
      - name: SBOM
        run: pnpm sbom --sbom-format spdx --out suite-desk-nightly.spdx.json
      - name: Attest the bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: suite-desk-nightly.flatpak
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: suite-desk-nightly.flatpak
          sbom-path: suite-desk-nightly.spdx.json
      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-desk-nightly-flatpak
          path: |
            suite-desk-nightly.flatpak
            suite-desk-nightly.spdx.json
          retention-days: 14
          if-no-files-found: error

  package-android:
    name: package-android
    needs: [published, gate]
    if: vars.NIGHTLY_PUBLISH != 'true' && needs.published.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: pnpm install --frozen-lockfile
      # No release key here, so this is the flavor's debug build: proof that the
      # app assembles, not the signed artifact a release carries.
      - name: Build the debug APK
        run: |
          pnpm --filter "./packages/*" run build
          pnpm --filter @suite/go-app build
          pnpm --filter @suite/go-app exec cap sync android
          cd hosts/go/android
          ./gradlew assembleStableDebug
          cp app/build/outputs/apk/stable/debug/app-stable-debug.apk \
            "$GITHUB_WORKSPACE/suite-go-debug.apk"
      - name: SBOM
        run: pnpm sbom --sbom-format spdx --out suite-go-debug.spdx.json
      - name: Attest the APK
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: suite-go-debug.apk
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: suite-go-debug.apk
          sbom-path: suite-go-debug.spdx.json
      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-go-nightly-debug-apk
          path: |
            suite-go-debug.apk
            suite-go-debug.spdx.json
          retention-days: 14
          if-no-files-found: error

  review:
    name: ocr-review-nightly
    needs: [published, gate]
    # Non-publishing nights only. A publishing night runs the same boundary
    # workflow from release.yml. The boundary workflow falls back to the last
    # 24 hours when no nightly tag exists, so a non-publishing night still has
    # a range to review.
    if: >-
      vars.NIGHTLY_PUBLISH != 'true' &&
      needs.published.outputs.published != 'true' &&
      needs.gate.result == 'success'
    uses: ./.github/workflows/ocr-boundary.yml
    with:
      channel: nightly
      effort: high
      budget: "5000000"
      max_tokens: "200000"
    secrets:
      DEEPRELAY_API_KEY: ${{ secrets.DEEPRELAY_API_KEY }}

  # The publishing mode. It runs the whole release workflow, including its own
  # full gate, so the nightly proof and the artifact that ships are the same run.
  publish:
    name: publish-nightly
    needs: published
    if: vars.NIGHTLY_PUBLISH == 'true' && needs.published.outputs.published != 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      channel: nightly
      publish: true
    secrets: inherit

  report:
    name: report
    needs: [published, gate, package-linux, package-android, publish]
    # Green nights close the rolling issue; red ones open or update it. One
    # issue, not one per night (C10.1).
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Open, update or close the rolling nightly issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK: ${{ needs.published.result }}
          ALREADY: ${{ needs.published.outputs.published }}
          GATE: ${{ needs.gate.result }}
          LINUX: ${{ needs.package-linux.result }}
          ANDROID: ${{ needs.package-android.result }}
          PUBLISH: ${{ needs.publish.result }}
        with:
          script: |
            const label = "ci-nightly";
            const title = "Nightly gate is red";
            // A second run that stopped before the gate proved nothing, so it
            // must not close a red issue the first run opened. The one sentence
            // is on the already-published job; this job stays out of the way.
            if (process.env.ALREADY === "true") return;
            // One of the two modes runs; the other is skipped by design.
            const results = {
              "already-published": process.env.CHECK,
              gate: process.env.GATE,
              "package-linux": process.env.LINUX,
              "package-android": process.env.ANDROID,
              "publish-nightly": process.env.PUBLISH,
            };
            const failed = Object.entries(results).filter(
              ([, result]) => result !== "success" && result !== "skipped",
            );
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            try {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: "d73a4a",
                description: "The scheduled nightly gate or packaging failed",
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const open = await github.rest.issues.listForRepo({
              ...context.repo,
              labels: label,
              state: "open",
              per_page: 1,
            });

            if (failed.length === 0) {
              if (open.data.length === 0) return;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open.data[0].number,
                body: `Nightly is green again on \`${context.sha}\`. ${runUrl}`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: open.data[0].number,
                state: "closed",
              });
              return;
            }

            const body = [
              `The nightly run failed on \`${context.sha}\`.`,
              "",
              `Failed: ${failed.map(([name, result]) => `\`${name}\` (${result})`).join(", ")}`,
              "",
              `Run: ${runUrl}`,
            ].join("\n");

            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: [label],
              });
            }
