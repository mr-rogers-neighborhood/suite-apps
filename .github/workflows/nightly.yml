# Nightly proof: the full gate with e2e, then the two artifacts that carry this
# repository's installs. It builds and attests; it does not publish. A nightly
# artifact is not a release, and publication still needs the signed Flatpak
# remote and the release keystore in a protected environment (ci.md, C9).
#
# A failure opens or updates one issue instead of a new one per night (C10.1).
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  gate:
    name: nightly-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Playwright browser (Canvas stories)
        run: pnpm --filter @suite/canvas exec playwright install --with-deps chromium
      - name: Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Fresh gate with e2e
        run: node scripts/gate.mjs --fresh

  package-linux:
    name: package-linux
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Flatpak tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - name: Flatpak runtimes
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08
      - name: Build the host Flatpak (nightly branch)
        env:
          SUITE_FLATPAK_REPO: ${{ github.workspace }}/.nightly/flatpak-repo
        run: node scripts/flatpak.mjs --app shell --channel nightly --no-install
      - name: Bundle
        run: |
          flatpak build-bundle "$GITHUB_WORKSPACE/.nightly/flatpak-repo" suite-shell-nightly.flatpak \
            run.suite.slop.shell nightly
      - name: Attest the bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: suite-shell-nightly.flatpak
      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-shell-nightly-flatpak
          path: suite-shell-nightly.flatpak
          retention-days: 14
          if-no-files-found: error

  package-android:
    name: package-android
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: pnpm install --frozen-lockfile
      # No release key here, so this is the flavor's debug build: proof that the
      # app assembles, not the signed artifact a release carries.
      - name: Build the debug APK
        run: |
          pnpm --filter "./packages/*" run build
          pnpm --filter @suite/go-app build
          pnpm --filter @suite/go-app exec cap sync android
          cd apps/go/android
          ./gradlew assembleStableDebug
          cp app/build/outputs/apk/stable/debug/app-stable-debug.apk \
            "$GITHUB_WORKSPACE/suite-go-debug.apk"
      - name: Attest the APK
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: suite-go-debug.apk
      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-go-nightly-debug-apk
          path: suite-go-debug.apk
          retention-days: 14
          if-no-files-found: error

  report:
    name: report
    needs: [gate, package-linux, package-android]
    # Green nights close the rolling issue; red ones open or update it. One
    # issue, not one per night (C10.1).
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Open, update or close the rolling nightly issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GATE: ${{ needs.gate.result }}
          LINUX: ${{ needs.package-linux.result }}
          ANDROID: ${{ needs.package-android.result }}
        with:
          script: |
            const label = "ci-nightly";
            const title = "Nightly gate is red";
            const results = {
              gate: process.env.GATE,
              "package-linux": process.env.LINUX,
              "package-android": process.env.ANDROID,
            };
            const failed = Object.entries(results).filter(([, result]) => result !== "success");
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            try {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: "d73a4a",
                description: "The scheduled nightly gate or packaging failed",
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const open = await github.rest.issues.listForRepo({
              ...context.repo,
              labels: label,
              state: "open",
              per_page: 1,
            });

            if (failed.length === 0) {
              if (open.data.length === 0) return;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open.data[0].number,
                body: `Nightly is green again on \`${context.sha}\`. ${runUrl}`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: open.data[0].number,
                state: "closed",
              });
              return;
            }

            const body = [
              `The nightly run failed on \`${context.sha}\`.`,
              "",
              `Failed: ${failed.map(([name, result]) => `\`${name}\` (${result})`).join(", ")}`,
              "",
              `Run: ${runUrl}`,
            ].join("\n");

            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: [label],
              });
            }
