# Phase 2 of the CI spec: a pull request runs the checks its diff can break, and
# the root checks stay unconditional. The full fresh gate on `main` lives in
# main.yml; nightly packaging is Phase 3. Start's Playwright suite left with
# Start (#314), so there is no e2e job until a host suite marks a pipeline row.
#
# The affected map is scripts/affected.mjs, which reads the workspace graph. A
# path it does not understand selects every row; it never silently skips one.
# actionlint lives in `fast` behind the same map (#422): a workflow change runs
# it, every other pull request and merge does not pay for a Go install.
name: ci

on:
  pull_request:
    branches: [main]
    # `labeled` is load-bearing: adding the `proof` label (or `ci:full` on a
    # fork) has to start a run, and GitHub only starts one for a listed type.
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
      proof_matrix: ${{ steps.affected.outputs.proof_matrix }}
      proof_any: ${{ steps.affected.outputs.proof_any }}
      e2e: ${{ steps.affected.outputs.e2e }}
      docs_only: ${{ steps.affected.outputs.docs_only }}
      workflows: ${{ steps.affected.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve the base
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            echo "SUITE_BASE=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_ENV"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            echo "SUITE_BASE=origin/${GITHUB_BASE_REF}" >> "$GITHUB_ENV"
          else
            git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
            echo "SUITE_BASE=origin/main" >> "$GITHUB_ENV"
          fi
      - name: Affected rows
        id: affected
        run: node scripts/affected.mjs --base "$SUITE_BASE"

  fast:
    name: fast
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Go
        # Only a workflow diff needs actionlint; installing Go on every pull
        # request was the separate `workflows` job (#422).
        if: needs.detect.outputs.workflows == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: actionlint
        if: needs.detect.outputs.workflows == 'true'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # SC2016 fires on the intentional single-quoted `node -e` scripts
          # (release.yml's OIDC claims, weekly.yml's cache filter); the `$` is
          # for node, not the shell.
          "$(go env GOPATH)/bin/actionlint" -ignore 'SC2016' .github/workflows/*.yml
      - name: Spec check (when the spec is present)
        if: hashFiles('scripts/spec.test.mjs') != ''
        run: node --test scripts/spec.test.mjs
      - name: Docs links
        run: pnpm docs:check
      - name: Docs index
        run: pnpm docs:index
      - name: Docs index check
        run: pnpm docs:index:check
      - name: Scripts without a build
        run: >-
          node --test
          scripts/affected.test.mjs
          scripts/slop-targets.test.mjs
          scripts/proof-of-changes.test.mjs
          scripts/release-manifest.test.mjs
          scripts/channel.test.mjs
          scripts/desk-channel.test.mjs
          scripts/android-release.test.mjs
          scripts/release-status.test.mjs
          scripts/delivery-signals.test.mjs
          scripts/flatpak-remote.test.mjs

  dependency-review:
    name: dependency-review
    # Evidence, not a required check: the aggregator does not wait for it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

  apps:
    name: apps (${{ matrix.repo }})
    needs: detect
    # A fork pull request runs fast checks only until a maintainer labels it
    # `ci:full`; same-repo PRs, the merge queue and dispatch run as before
    # (C2.4).
    if: >-
      needs.detect.result == 'success' && needs.detect.outputs.matrix != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository ||
       contains(github.event.pull_request.labels.*.name, 'ci:full'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: pnpm
        if: matrix.repo != 'none'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - name: Node
        if: matrix.repo != 'none'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Base ref for `--changed`
        if: matrix.repo != 'none' && github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
      - name: Install
        if: matrix.repo != 'none'
        run: pnpm install --frozen-lockfile
      - name: Resolve the Playwright version
        if: matrix.repo == 'canvas'
        id: playwright
        run: |
          version="$(node -e 'console.log(require("./legacy/canvas/e2e/node_modules/@playwright/test/package.json").version)')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Playwright browser cache
        if: matrix.repo == 'canvas'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Playwright browser (Canvas stories)
        if: matrix.repo == 'canvas'
        run: pnpm --filter @suite/canvas exec playwright install --with-deps chromium
      - name: Resolve the Playwright version (UI)
        if: matrix.repo == 'ui'
        id: playwright-ui
        run: |
          version="$(node -e 'console.log(require("./packages/ui/node_modules/playwright/package.json").version)')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Playwright browser cache (UI stories)
        if: matrix.repo == 'ui'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ui-${{ runner.os }}-${{ steps.playwright-ui.outputs.version }}
      - name: Playwright browser (UI stories)
        if: matrix.repo == 'ui'
        run: pnpm --filter @suite/ui exec playwright install --with-deps chromium
      - name: Nothing affected
        if: matrix.repo == 'none'
        run: echo "No app gate is affected by this change."
      - name: Gate ${{ matrix.repo }}
        if: matrix.repo != 'none'
        run: node scripts/gate.mjs --only "${{ matrix.repo }}" --no-e2e

  proof:
    name: proof (${{ matrix.repo }})
    # Evidence, not a required check (matching C8.3 for Revyl): runs only for
    # the desktop rows whose diff can break them, writes the "Proof of
    # Changes" block to the step summary, and uploads screenshot/trace
    # artifacts.
    #
    # On a pull request it waits for the `proof` label: the same harness, on
    # demand, instead of a screenshot artifact per push (#407). A manual
    # dispatch still runs it, so the mechanism is reachable without a label.
    needs: detect
    if: >-
      needs.detect.result == 'success' && needs.detect.outputs.proof_matrix != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'proof'))) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository ||
       contains(github.event.pull_request.labels.*.name, 'ci:full'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.proof_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Electron system libraries and Xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pnpm --dir legacy/budget exec playwright install-deps chromium
      - name: Proof of Changes (${{ matrix.repo }})
        run: node scripts/proof-of-changes.mjs --only "${{ matrix.repo }}"
      - name: Write Proof of Changes summary
        if: always() && hashFiles('.dev/proof/index.md') != ''
        run: cat .dev/proof/index.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload proof artifacts (${{ matrix.repo }})
        if: always() && hashFiles('.dev/proof/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-proof-${{ matrix.repo }}
          path: .dev/proof/
          retention-days: 14

  full-gate:
    name: full-gate
    # Kept for an on-demand full tree until Phase 3's nightly owns it.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version="$(node -e 'console.log(require("./legacy/canvas/e2e/node_modules/@playwright/test/package.json").version)')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Playwright browser (Canvas stories)
        run: pnpm --filter @suite/canvas exec playwright install --with-deps chromium
      - name: Fresh gate
        run: node scripts/gate.mjs --fresh --no-e2e

  ci:
    name: ci
    if: always()
    needs: [detect, fast, apps, full-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        run: |
          test "${{ needs.detect.result }}" = "success"
          test "${{ needs.fast.result }}" = "success"
          if [ "${{ needs.apps.result }}" != "success" ] && [ "${{ needs.apps.result }}" != "skipped" ]; then
            echo "apps: ${{ needs.apps.result }}"
            exit 1
          fi
          if [ "${{ needs.full-gate.result }}" != "success" ] && [ "${{ needs.full-gate.result }}" != "skipped" ]; then
            echo "full-gate: ${{ needs.full-gate.result }}"
            exit 1
          fi
