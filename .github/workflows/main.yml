# The trunk proof: every push to `main` runs the whole gate from a fresh export
# of the commit, the same command a person runs. The VM remains the independent
# copy until the matrix matches it for a month (ci.md, Migration 6).
#
# e2e stays on the merge queue and nightly; a trunk push must not spend its
# budget on a desktop suite that already ran on the queue entry.
name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main-gate:
    name: main-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Playwright browser (Canvas stories)
        run: pnpm --filter @suite/canvas exec playwright install --with-deps chromium
      - name: Fresh gate
        run: node scripts/gate.mjs --fresh --no-e2e
