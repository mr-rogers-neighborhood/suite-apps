# Temporary live test for the reusable OCR boundary workflow. Deleted after
# the run; the production callers are nightly.yml and release.yml.
name: ocr-test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    uses: ./.github/workflows/ocr-boundary.yml
    with:
      channel: preview
      effort: low
      budget: "600000"
      max_tokens: "200000"
      from: ${{ github.event.pull_request.base.sha }}
      advisory: false
    secrets:
      DEEPRELAY_API_KEY: ${{ secrets.DEEPRELAY_API_KEY }}
