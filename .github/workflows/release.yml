# Publication: the one workflow that signs and ships a channel.
#
# It runs from `workflow_dispatch` on `main`, or from the nightly through
# `workflow_call`. There is no pull-request trigger and no tag trigger: the
# scripts read the version from the tree and `scripts/release-status.mjs` creates
# the `<app>-v<version>` and `suite-YYYY.MM.DD` tags. A release tag is followed by
# a dispatch; it never starts a second build from another tree.
#
# Two environments, deliberately separate:
#
# - `approval` requires a reviewer. A `preview` or `stable` dispatch cannot reach
#   the publish job until a person approves that deployment. A nightly call skips
#   this job, because a schedule cannot wait for a click (delivery.md D3.2).
# - `release` holds the signing keys and is restricted to `main` and release
#   tags. It has no reviewers: the approval is the separate job, and a pull
#   request can never reach either environment (ci.md C9.3, D5.5).
#
# `publish` is off for a manual dispatch. With it off the job runs the gate,
# builds and signs both artifacts, attests them, and stops: a rehearsal. It still
# needs the keys, because the Android release APK cannot be built or verified
# without the keystore.
#
# The flow is draft → attach → publish, the only order an immutable release
# allows (D6.3):
#
#   1. `release-status.mjs --draft` creates or updates every release as a draft.
#   2. `android-release.mjs --upload <apk> --publish` uploads the exact APK this
#      job built and attested into that draft. The Flatpak remote is published
#      from the repository this job built.
#   3. `release-status.mjs --publish` flips the drafts and writes RELEASES.md.
#
# Signing keys are environment secrets, never repository secrets:
#
#   SUITE_STORE_KEY               armored GPG private key for the origin summary
#   SUITE_STORE_KEY_ID            its fingerprint, so the scripts sign with it
#   SUITE_GO_KEYSTORE             base64 of the Android release keystore
#   SUITE_GO_KEYSTORE_PASSWORD    its store password
#   SUITE_GO_KEY_ALIAS            its key alias (the scripts default to suite-go)
#   SUITE_GO_KEY_PASSWORD         its key password (defaults to the store password)
#
# The S3 target also needs the repository variables `AWS_RELEASE_ROLE_ARN` (the
# role GitHub OIDC assumes, trusted for this repository's `release` environment),
# `SUITE_FLATPAK_S3_BUCKET` and `SUITE_FLATPAK_CLOUDFRONT_DISTRIBUTION`;
# `AWS_RELEASE_REGION` is optional and defaults to us-east-1.
#
# Known limits, recorded rather than hidden:
#
# - The Flatpak summary is re-signed by `flatpak-remote.mjs` at publish time; the
#   OSTree commit does not change, so the workflow attests the commit (bundled)
#   rather than the summary. The APK is uploaded from the bytes this job built.
# - `release-status.mjs` has no channel input, so a `preview` dispatch still
#   refreshes the rolling `suite-YYYY.MM.DD` release.
# - `RELEASES.md` is rewritten in the runner and not committed; the mirror on
#   `main` updates when someone commits the generated file.
# - The `lan` target stays a workstation operation: a runner has neither the SSH
#   key nor the host.
name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to build (preview or stable)
        required: true
        type: choice
        default: preview
        options:
          - preview
          - stable
      publish:
        description: Sign and publish; off runs the same build without touching a channel
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      channel:
        description: Channel the caller wants published (nightly)
        required: true
        type: string
      publish:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  approval:
    name: approve-${{ inputs.channel }}
    # A schedule cannot wait for a reviewer. `preview` and `stable` can, and do.
    if: inputs.channel != 'nightly'
    runs-on: ubuntu-latest
    environment: approval
    steps:
      - name: Approved
        run: echo "The ${{ inputs.channel }} publication was approved."

  publish:
    name: publish-${{ inputs.channel }}
    needs: approval
    if: always() && (inputs.channel == 'nightly' || needs.approval.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    # This one job holds the keys and the release upload, so the write scope
    # covers the whole job. It exists for `gh release create`/`upload` and the tag
    # creation; the repository default stays `contents: read`.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SUITE_FLATPAK_REPO: ${{ github.workspace }}/.dev/flatpak-repo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `release-status.mjs` finds the commit that added a changelog section
          # with `git log -S`; a depth-1 clone cannot answer that.
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright browser (Canvas stories)
        run: pnpm --filter @suite/canvas exec playwright install --with-deps chromium

      - name: Gate tooling
        run: sudo apt-get update && sudo apt-get install -y xvfb flatpak flatpak-builder ostree

      - name: Flatpak runtimes
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      # C1.3: the release runs the same command a person runs. `--fresh` proves
      # the commit in a clean export and writes .dev/gate-status.json; the
      # publishing scripts refuse without it.
      - name: Fresh gate with e2e
        run: node scripts/gate.mjs --fresh

      # The release APK cannot be built or verified without the keystore, so the
      # import runs for a rehearsal too. It fails early and loudly when the
      # environment has no secrets.
      - name: Import the store and Android keys
        env:
          SUITE_STORE_KEY: ${{ secrets.SUITE_STORE_KEY }}
          SUITE_STORE_KEY_ID: ${{ secrets.SUITE_STORE_KEY_ID }}
          SUITE_GO_KEYSTORE_B64: ${{ secrets.SUITE_GO_KEYSTORE }}
        run: |
          set -euo pipefail

          if [ -z "${SUITE_STORE_KEY}" ] || [ -z "${SUITE_STORE_KEY_ID}" ]; then
            echo "SUITE_STORE_KEY and SUITE_STORE_KEY_ID are required; a published remote is always GPG-signed" >&2
            exit 1
          fi
          if [ -z "${SUITE_GO_KEYSTORE_B64}" ]; then
            echo "SUITE_GO_KEYSTORE is required; a debug-signed APK is never a release" >&2
            exit 1
          fi

          gnupg="${RUNNER_TEMP}/gnupg"
          mkdir -p "${gnupg}"
          chmod 700 "${gnupg}"
          export GNUPGHOME="${gnupg}"
          printf '%s\n' "${SUITE_STORE_KEY}" | gpg --batch --import
          gpg --batch --list-keys "${SUITE_STORE_KEY_ID}" >/dev/null

          # The publish scripts sign with --batch. Prove the imported key can
          # sign unattended before an hour of gate and build work happens.
          printf 'suite release\n' | \
            gpg --batch --yes --local-user "${SUITE_STORE_KEY_ID}" --armor --detach-sign >/dev/null

          keys="${RUNNER_TEMP}/keys"
          mkdir -p "${keys}"
          printf '%s' "${SUITE_GO_KEYSTORE_B64}" | base64 -d > "${keys}/suite-go-release.jks"
          chmod 600 "${keys}/suite-go-release.jks"

          # GNUPGHOME and the keystore path are not secrets; the passwords are
          # supplied only to the steps that need them.
          {
            echo "GNUPGHOME=${gnupg}"
            echo "SUITE_GO_KEYSTORE=${keys}/suite-go-release.jks"
          } >> "${GITHUB_ENV}"

      - name: Build the Shell Flatpak (${{ inputs.channel }})
        env:
          CHANNEL: ${{ inputs.channel }}
          SUITE_STORE_KEY_ID: ${{ secrets.SUITE_STORE_KEY_ID }}
        run: |
          set -euo pipefail
          args=(--app shell)
          if [ "${CHANNEL}" != "stable" ]; then args+=(--channel "${CHANNEL}"); fi
          node scripts/flatpak.mjs "${args[@]}" --no-install

      # The OSTree commit is the artifact the channel serves; the summary is
      # metadata that is re-signed at publication. Record the commit and bundle
      # it, so the attestation names bytes a verifier can check.
      - name: Record and bundle the Flatpak commit
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p .dev/release
          if [ "${CHANNEL}" = "stable" ]; then
            ref=run.suite.shell
            branch=master
          else
            ref=run.suite.slop.shell
            branch="${CHANNEL}"
          fi
          ostree --repo="${SUITE_FLATPAK_REPO}" rev-parse "${ref}" \
            > ".dev/release/suite-shell-${CHANNEL}.commit"
          cat ".dev/release/suite-shell-${CHANNEL}.commit"
          flatpak build-bundle "${SUITE_FLATPAK_REPO}" \
            ".dev/release/suite-shell-${CHANNEL}.flatpak" "${ref}" "${branch}"

      - name: Build the Suite Go release APK (${{ inputs.channel }})
        id: apk
        env:
          CHANNEL: ${{ inputs.channel }}
          SUITE_GO_KEYSTORE_PASSWORD: ${{ secrets.SUITE_GO_KEYSTORE_PASSWORD }}
          SUITE_GO_KEY_ALIAS: ${{ secrets.SUITE_GO_KEY_ALIAS }}
          SUITE_GO_KEY_PASSWORD: ${{ secrets.SUITE_GO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/android-release.mjs --channel "${CHANNEL}"

          # The stable channel also writes the `suite-go.apk` alias; attest and
          # upload the versioned file, not a second name for the same bytes.
          apk="$(find apps/go/.dev/release -maxdepth 1 -name 'suite-go-*.apk' ! -name 'suite-go.apk' -print -quit)"
          if [ -z "${apk}" ]; then
            echo "the APK build named no versioned suite-go-*.apk" >&2
            exit 1
          fi
          echo "path=${apk}" >> "${GITHUB_OUTPUT}"

      - name: Generate the SPDX SBOM
        run: |
          set -euo pipefail
          mkdir -p .dev/release
          pnpm sbom --sbom-format spdx --out .dev/release/suite-apps.spdx.json
          test -s .dev/release/suite-apps.spdx.json

      # Evidence before publication (D4.1 step 3, D5.4). A rehearsal changes
      # nothing outside the runner, so it stops before these.
      - name: Attest the Flatpak provenance
        if: inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .dev/release/suite-shell-${{ inputs.channel }}.flatpak

      - name: Attest the APK provenance
        if: inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.apk.outputs.path }}

      - name: Attest the Flatpak SBOM
        if: inputs.publish
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: .dev/release/suite-shell-${{ inputs.channel }}.flatpak
          sbom-path: .dev/release/suite-apps.spdx.json

      - name: Attest the APK SBOM
        if: inputs.publish
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.apk.outputs.path }}
          sbom-path: .dev/release/suite-apps.spdx.json

      - name: Check the S3 publishing configuration
        if: inputs.publish
        env:
          ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          BUCKET: ${{ vars.SUITE_FLATPAK_S3_BUCKET }}
          DISTRIBUTION: ${{ vars.SUITE_FLATPAK_CLOUDFRONT_DISTRIBUTION }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ROLE_ARN}" ] || missing+=("repository variable AWS_RELEASE_ROLE_ARN")
          [ -n "${BUCKET}" ] || missing+=("SUITE_FLATPAK_S3_BUCKET")
          [ -n "${DISTRIBUTION}" ] || missing+=("SUITE_FLATPAK_CLOUDFRONT_DISTRIBUTION")
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'The s3 target also needs:\n'
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: AWS credentials (OIDC)
        if: inputs.publish && vars.AWS_RELEASE_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          role-session-name: suite-release-${{ inputs.channel }}
          aws-region: ${{ vars.AWS_RELEASE_REGION || 'us-east-1' }}

      # Draft first: an immutable release cannot take an asset after it is
      # published, so the APK and the body must be final while it is a draft.
      - name: Create or update the draft releases
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-status.mjs --draft

      - name: Upload the exact APK into the draft
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          APK: ${{ steps.apk.outputs.path }}
          SUITE_GO_KEYSTORE_PASSWORD: ${{ secrets.SUITE_GO_KEYSTORE_PASSWORD }}
          SUITE_GO_KEY_ALIAS: ${{ secrets.SUITE_GO_KEY_ALIAS }}
          SUITE_GO_KEY_PASSWORD: ${{ secrets.SUITE_GO_KEY_PASSWORD }}
        run: node scripts/android-release.mjs --upload "${APK}" --channel "${CHANNEL}" --publish

      - name: Publish the signed Flatpak remote
        if: inputs.publish
        env:
          CHANNEL: ${{ inputs.channel }}
          SUITE_STORE_KEY_ID: ${{ secrets.SUITE_STORE_KEY_ID }}
          SUITE_FLATPAK_S3_BUCKET: ${{ vars.SUITE_FLATPAK_S3_BUCKET }}
          SUITE_FLATPAK_CLOUDFRONT_DISTRIBUTION: ${{ vars.SUITE_FLATPAK_CLOUDFRONT_DISTRIBUTION }}
        run: |
          set -euo pipefail
          args=(--target s3 --from-repo "${SUITE_FLATPAK_REPO}")
          if [ "${CHANNEL}" != "stable" ]; then args+=(--channel "${CHANNEL}"); fi
          node scripts/flatpak-remote.mjs "${args[@]}" --publish

      - name: Publish the drafts and write RELEASES.md
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-status.mjs --publish

      - name: Upload the artifacts
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-${{ inputs.channel }}-release
          path: |
            .dev/release/suite-apps.spdx.json
            .dev/release/suite-shell-${{ inputs.channel }}.commit
            .dev/release/suite-shell-${{ inputs.channel }}.flatpak
            ${{ steps.apk.outputs.path }}
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
