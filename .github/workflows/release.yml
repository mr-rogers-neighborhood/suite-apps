# Publication: the one workflow that signs and ships a channel.
#
# It runs from `workflow_dispatch` on `main`, or from the nightly through
# `workflow_call`. There is no pull-request trigger and no tag trigger: the
# scripts read the version from the tree and `scripts/release-status.mjs` creates
# the `<app>-v<version>` and `suite-YYYY.MM.DD` tags. A release tag is followed by
# a dispatch; it never starts a second build from another tree.
#
# Two environments, deliberately separate:
#
# - `approval` requires a reviewer. A `preview` or `stable` dispatch cannot reach
#   the publish job until a person approves that deployment. A nightly call skips
#   this job, because a schedule cannot wait for a click (delivery.md D3.2).
# - `release` holds the signing keys and is restricted to `main` and release
#   tags. It has no reviewers: the approval is the separate job, and a pull
#   request can never reach either environment (ci.md C9.3, D5.5).
#
# `publish` is off for a manual dispatch. With it off the job runs the gate,
# builds and signs both artifacts, attests them, and stops: a rehearsal. It still
# needs the keys, because the Android release APK cannot be built or verified
# without the keystore. Its clean-install check then installs whatever the public
# remote serves on the stable branch today, and skips when nothing is there, so
# the mechanism proves itself without publishing a build.
#
# The flow is draft → attach → publish, the only order an immutable release
# allows (D6.3):
#
#   1. `release-status.mjs --draft` creates or updates every release as a draft.
#   2. `android-release.mjs --upload <apk> --publish` uploads the exact APK this
#      job built and attested into that draft. The Flatpak remote is published
#      from the repository this job built.
#   3. The published remote is installed in a throwaway user installation and
#      launched, on a host that knows nothing but the public URL. This is the
#      install test D4.1 step 5 and P5.1 ask for; the summary check inside
#      `flatpak-remote.mjs` proves the signature, not that a client can resolve,
#      install and run the ref.
#   4. `release-status.mjs --publish` flips the drafts and writes RELEASES.md.
#
# The catalogue index is built from the packs this job staged (none yet), before
# the draft so its operator fingerprint reaches the notes, and uploaded after the
# Flatpak remote so an entry never names an archive that did not ship. The remote
# is the same one, under `/packs/`; a missing operator key fails the step, while
# an empty pack list prints that there is nothing to index.
#
# Signing keys are environment secrets, never repository secrets:
#
#   SUITE_STORE_KEY               armored GPG private key for the origin summary
#   SUITE_STORE_KEY_ID            its fingerprint, so the scripts sign with it
#   SUITE_INDEX_KEY               Ed25519 operator key for the catalogue index
#   SUITE_INDEX_KEY_FINGERPRINT   its pinned fingerprint; a mismatch fails the index step
#   SUITE_PACK_KEY                Ed25519 publisher key, when a pack build needs it
#   SUITE_GO_KEYSTORE             base64 of the Android release keystore
#   SUITE_GO_KEYSTORE_PASSWORD    its store password
#   SUITE_GO_KEY_ALIAS            its key alias (the scripts default to suite-go)
#   SUITE_GO_KEY_PASSWORD         its key password (defaults to the store password)
#
# The S3 target also needs the repository variables `AWS_RELEASE_ROLE_ARN` (the
# role GitHub OIDC assumes, trusted for this repository's `release` environment),
# `SUITE_FLATPAK_S3_BUCKET` and `SUITE_FLATPAK_CLOUDFRONT_DISTRIBUTION`;
# `AWS_RELEASE_REGION` is optional and defaults to us-east-1.
#
# Known limits, recorded rather than hidden:
#
# - The Flatpak summary is re-signed by `flatpak-remote.mjs` at publish time; the
#   OSTree commit does not change, so the workflow attests the commit (bundled)
#   rather than the summary. The APK is uploaded from the bytes this job built.
# - Pre-release channels publish their own release, never the stable Latest one.
#   Nightly keeps the newest 14 and prunes older ones (D6.1, and a readable
#   Releases page); preview is retained as release-candidate history.
# - `RELEASES.md` is rewritten in the runner and not committed; the mirror on
#   `main` updates when someone commits the generated file.
# - The `lan` target stays a workstation operation: a runner has neither the SSH
#   key nor the host.
name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to build (preview or stable)
        required: true
        type: choice
        default: preview
        options:
          - preview
          - stable
      publish:
        description: Sign and publish; off runs the same build without touching a channel
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      channel:
        description: Channel the caller wants published (nightly)
        required: true
        type: string
      publish:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  approval:
    name: approve-${{ inputs.channel }}
    # A schedule cannot wait for a reviewer. `preview` and `stable` can, and do.
    if: inputs.channel != 'nightly'
    runs-on: ubuntu-latest
    environment: approval
    steps:
      - name: Approved
        run: echo "The ${{ inputs.channel }} publication was approved."

  publish:
    name: publish-${{ inputs.channel }}
    needs: approval
    if: always() && (inputs.channel == 'nightly' || needs.approval.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    # This one job holds the keys and the release upload, so the write scope
    # covers the whole job. It exists for `gh release create`/`upload` and the tag
    # creation; the repository default stays `contents: read`.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SUITE_FLATPAK_REPO: ${{ github.workspace }}/.dev/flatpak-repo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `release-status.mjs` finds the commit that added a changelog section
          # with `git log -S`; a depth-1 clone cannot answer that.
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: pnpm install --frozen-lockfile

      # The claims are public and short-lived; printing them turns an opaque
      # AssumeRoleWithWebIdentity refusal into the exact sub and aud AWS saw.
      - name: OIDC claims
        run: |
          set -euo pipefail
          response="$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(printf '%s' "${response}" | jq -r .value)"
          node -e '
            const claims = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url"));
            for (const key of ["sub", "aud", "environment", "ref", "repository", "repository_owner"]) {
              if (claims[key] !== undefined) console.log(`${key}: ${claims[key]}`);
            }
          ' "${token}"

      - name: Check the S3 publishing configuration
        if: inputs.publish
        env:
          ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          BUCKET: ${{ vars.SUITE_FLATPAK_S3_BUCKET }}
          DISTRIBUTION: ${{ vars.SUITE_FLATPAK_CLOUDFRONT_DISTRIBUTION }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ROLE_ARN}" ] || missing+=("repository variable AWS_RELEASE_ROLE_ARN")
          [ -n "${BUCKET}" ] || missing+=("SUITE_FLATPAK_S3_BUCKET")
          [ -n "${DISTRIBUTION}" ] || missing+=("SUITE_FLATPAK_CLOUDFRONT_DISTRIBUTION")
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'The s3 target also needs:\n'
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

      # Also on a rehearsal: assuming the role proves the trust policy without
      # publishing anything.
      - name: AWS credentials (OIDC)
        if: vars.AWS_RELEASE_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          role-session-name: suite-release-${{ inputs.channel }}
          aws-region: ${{ vars.AWS_RELEASE_REGION || 'us-east-1' }}


      - name: Playwright browser (Canvas stories)
        run: pnpm --filter @suite/canvas exec playwright install --with-deps chromium

      - name: Gate tooling
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus flatpak flatpak-builder ostree

      - name: Flatpak runtimes
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      # C1.3: the release runs the same command a person runs. `--fresh` proves
      # the commit in a clean export and writes .dev/gate-status.json; the
      # publishing scripts refuse without it.
      - name: Fresh gate with e2e
        run: node scripts/gate.mjs --fresh

      # The release APK cannot be built or verified without the keystore, so the
      # import runs for a rehearsal too. It fails early and loudly when the
      # environment has no secrets.
      - name: Import the store and Android keys
        env:
          SUITE_STORE_KEY: ${{ secrets.SUITE_STORE_KEY }}
          SUITE_STORE_KEY_ID: ${{ secrets.SUITE_STORE_KEY_ID }}
          SUITE_GO_KEYSTORE_B64: ${{ secrets.SUITE_GO_KEYSTORE }}
        run: |
          set -euo pipefail

          if [ -z "${SUITE_STORE_KEY}" ] || [ -z "${SUITE_STORE_KEY_ID}" ]; then
            echo "SUITE_STORE_KEY and SUITE_STORE_KEY_ID are required; a published remote is always GPG-signed" >&2
            exit 1
          fi
          if [ -z "${SUITE_GO_KEYSTORE_B64}" ]; then
            echo "SUITE_GO_KEYSTORE is required; a debug-signed APK is never a release" >&2
            exit 1
          fi

          gnupg="${RUNNER_TEMP}/gnupg"
          mkdir -p "${gnupg}"
          chmod 700 "${gnupg}"
          export GNUPGHOME="${gnupg}"
          printf '%s\n' "${SUITE_STORE_KEY}" | gpg --batch --import
          gpg --batch --list-keys "${SUITE_STORE_KEY_ID}" >/dev/null

          # The publish scripts sign with --batch. Prove the imported key can
          # sign unattended before an hour of gate and build work happens.
          printf 'suite release\n' | \
            gpg --batch --yes --local-user "${SUITE_STORE_KEY_ID}" --armor --detach-sign >/dev/null

          keys="${RUNNER_TEMP}/keys"
          mkdir -p "${keys}"
          printf '%s' "${SUITE_GO_KEYSTORE_B64}" | base64 -d > "${keys}/suite-go-release.jks"
          chmod 600 "${keys}/suite-go-release.jks"

          # GNUPGHOME and the keystore path are not secrets; the passwords are
          # supplied only to the steps that need them.
          {
            echo "GNUPGHOME=${gnupg}"
            echo "SUITE_GO_KEYSTORE=${keys}/suite-go-release.jks"
          } >> "${GITHUB_ENV}"

      - name: Build the Shell Flatpak (${{ inputs.channel }})
        env:
          CHANNEL: ${{ inputs.channel }}
          SUITE_STORE_KEY_ID: ${{ secrets.SUITE_STORE_KEY_ID }}
        run: |
          set -euo pipefail
          args=(--app shell)
          if [ "${CHANNEL}" != "stable" ]; then args+=(--channel "${CHANNEL}"); fi
          node scripts/flatpak.mjs "${args[@]}" --no-install

      # The OSTree commit is the artifact the channel serves; the summary is
      # metadata that is re-signed at publication. Record the commit and bundle
      # it, so the attestation names bytes a verifier can check.
      - name: Record and bundle the Flatpak commit
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p .dev/release
          if [ "${CHANNEL}" = "stable" ]; then
            ref=run.suite.shell
            branch=master
          else
            ref=run.suite.slop.shell
            branch="${CHANNEL}"
          fi
          # Flatpak refs live at app/<id>/<arch>/<branch>, not at refs/heads/<id>.
          arch="$(flatpak --default-arch)"
          commit="$(ostree --repo="${SUITE_FLATPAK_REPO}" \
            rev-parse "app/${ref}/${arch}/${branch}")"
          printf '%s\n' "${commit}" > ".dev/release/suite-shell-${CHANNEL}.commit"
          cat ".dev/release/suite-shell-${CHANNEL}.commit"
          flatpak build-bundle "${SUITE_FLATPAK_REPO}" \
            ".dev/release/suite-shell-${CHANNEL}.flatpak" "${ref}" "${branch}"

      - name: Build the Suite Go release APK (${{ inputs.channel }})
        id: apk
        env:
          CHANNEL: ${{ inputs.channel }}
          # The versionCode preflight reads the newest published manifest with
          # `gh` and fails closed without a token.
          GH_TOKEN: ${{ github.token }}
          SUITE_GO_KEYSTORE_PASSWORD: ${{ secrets.SUITE_GO_KEYSTORE_PASSWORD }}
          SUITE_GO_KEY_ALIAS: ${{ secrets.SUITE_GO_KEY_ALIAS }}
          SUITE_GO_KEY_PASSWORD: ${{ secrets.SUITE_GO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/android-release.mjs --channel "${CHANNEL}"

          # The stable channel also writes the `suite-go.apk` alias; attest and
          # upload the versioned file, not a second name for the same bytes.
          apk="$(find apps/go/.dev/release -maxdepth 1 -name 'suite-go-*.apk' ! -name 'suite-go.apk' -print -quit)"
          if [ -z "${apk}" ]; then
            echo "the APK build named no versioned suite-go-*.apk" >&2
            exit 1
          fi
          echo "path=${apk}" >> "${GITHUB_OUTPUT}"

      - name: Generate the SPDX SBOM
        run: |
          set -euo pipefail
          mkdir -p .dev/release
          pnpm sbom --sbom-format spdx --out .dev/release/suite-apps.spdx.json
          test -s .dev/release/suite-apps.spdx.json

      # D2.1: one manifest per publication, naming the commit, the lockfile and
      # the artifact digests. It is attached to the draft before publication, so
      # it becomes immutable with the release.
      - name: Write the release manifest
        if: inputs.publish
        env:
          CHANNEL: ${{ inputs.channel }}
          APK: ${{ steps.apk.outputs.path }}
          SUITE_STORE_KEY_ID: ${{ secrets.SUITE_STORE_KEY_ID }}
        run: |
          set -euo pipefail
          if [ "${CHANNEL}" = "stable" ]; then
            app_id=run.suite.shell
            branch=master
            apk_id=run.suite.go
          else
            app_id=run.suite.slop.shell
            branch="${CHANNEL}"
            apk_id=run.suite.slop.go
          fi
          node scripts/release-manifest.mjs \
            --channel "${CHANNEL}" \
            --flatpak ".dev/release/suite-shell-${CHANNEL}.flatpak" \
            --flatpak-id "${app_id}" \
            --flatpak-branch "${branch}" \
            --flatpak-commit-file ".dev/release/suite-shell-${CHANNEL}.commit" \
            --apk "${APK}" \
            --apk-id "${apk_id}" \
            --out .dev/release/release-manifest.json

      # A pack is a release artifact only when a build command below names one.
      # Empty today: #324 adds Budget by adding one --build line. The step still
      # runs so a missing or mismatched operator key fails loudly once packs exist.
      - name: Build the catalogue index
        if: inputs.publish
        env:
          SUITE_INDEX_KEY: ${{ secrets.SUITE_INDEX_KEY }}
          SUITE_INDEX_KEY_FINGERPRINT: ${{ secrets.SUITE_INDEX_KEY_FINGERPRINT }}
          SUITE_PACK_KEY: ${{ secrets.SUITE_PACK_KEY }}
        run: |
          set -euo pipefail
          # --build "pnpm budget:pack --out .dev/release/packs/budget-0.1.0.suitepack"
          node scripts/release-index.mjs

      # Evidence before publication (D4.1 step 3, D5.4). A rehearsal changes
      # nothing outside the runner, so it stops before these.
      - name: Attest the Flatpak provenance
        if: inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .dev/release/suite-shell-${{ inputs.channel }}.flatpak

      - name: Attest the APK provenance
        if: inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.apk.outputs.path }}

      - name: Attest the Flatpak SBOM
        if: inputs.publish
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: .dev/release/suite-shell-${{ inputs.channel }}.flatpak
          sbom-path: .dev/release/suite-apps.spdx.json

      - name: Attest the APK SBOM
        if: inputs.publish
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.apk.outputs.path }}
          sbom-path: .dev/release/suite-apps.spdx.json

      - name: Attest the release manifest
        if: inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .dev/release/release-manifest.json

      # Draft first: an immutable release cannot take an asset after it is
      # published, so the APK and the body must be final while it is a draft.
      - name: Create or update the draft releases
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: node scripts/release-status.mjs --draft --channel "${CHANNEL}"

      # The manifest (D2.1) and the SBOM (D10 item 5) are assets of the draft, so
      # they become immutable with the release.
      - name: Attach the manifest and SBOM to the draft
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          tag="$(node --input-type=module \
            -e "import('./scripts/release-status.mjs').then((m) => console.log(m.currentAggregateTag({ channel: process.env.CHANNEL })))")"
          test -n "${tag}"
          gh release upload "${tag}" .dev/release/release-manifest.json --clobber
          gh release upload "${tag}" .dev/release/suite-apps.spdx.json --clobber

      - name: Upload the exact APK into the draft
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          APK: ${{ steps.apk.outputs.path }}
          SUITE_GO_KEYSTORE_PASSWORD: ${{ secrets.SUITE_GO_KEYSTORE_PASSWORD }}
          SUITE_GO_KEY_ALIAS: ${{ secrets.SUITE_GO_KEY_ALIAS }}
          SUITE_GO_KEY_PASSWORD: ${{ secrets.SUITE_GO_KEY_PASSWORD }}
        run: >-
          node scripts/android-release.mjs --upload "${APK}" --channel "${CHANNEL}"
          --publish

      - name: Publish the signed Flatpak remote
        if: inputs.publish
        env:
          CHANNEL: ${{ inputs.channel }}
          SUITE_STORE_KEY_ID: ${{ secrets.SUITE_STORE_KEY_ID }}
          SUITE_FLATPAK_S3_BUCKET: ${{ vars.SUITE_FLATPAK_S3_BUCKET }}
          SUITE_FLATPAK_CLOUDFRONT_DISTRIBUTION: ${{ vars.SUITE_FLATPAK_CLOUDFRONT_DISTRIBUTION }}
        run: |
          set -euo pipefail
          args=(--target s3 --from-repo "${SUITE_FLATPAK_REPO}")
          if [ "${CHANNEL}" != "stable" ]; then args+=(--channel "${CHANNEL}"); fi
          node scripts/flatpak-remote.mjs "${args[@]}" --publish

      - name: Publish the catalogue index
        if: inputs.publish
        env:
          SUITE_FLATPAK_S3_BUCKET: ${{ vars.SUITE_FLATPAK_S3_BUCKET }}
          SUITE_FLATPAK_CLOUDFRONT_DISTRIBUTION: ${{ vars.SUITE_FLATPAK_CLOUDFRONT_DISTRIBUTION }}
        run: node scripts/release-index.mjs --publish

      # D4.1 step 5, D10 item 7, P5.1: install the ref a client would get, from
      # the public URL, in an installation that has never seen this runner's
      # repository. A failure stops here, so the drafts stay unpublished and
      # nobody is told the build exists; the Flatpak branch can be repointed by
      # the next publication (D1.5).
      - name: Verify the published Flatpak from a clean install
        env:
          CHANNEL: ${{ inputs.channel }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          # A throwaway user installation. The gate's remotes, the repository
          # this job built and the S3 copy are all invisible from here.
          export FLATPAK_USER_DIR="${work}/user"
          export XDG_DATA_HOME="${work}/data"
          export FLATPAK_CONFIG_DIR="${work}/config"
          mkdir -p "${FLATPAK_USER_DIR}" "${XDG_DATA_HOME}" "${FLATPAK_CONFIG_DIR}"
          trap 'rm -rf "${work}"' EXIT

          # The Suite remote carries apps, not their runtime; a clean host adds
          # Flathub for that, exactly as the install instructions tell a person.
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists --from suite \
            https://flatpak.suite.run/suite.flatpakrepo

          expected=""
          if [ "${PUBLISH}" = "true" ]; then
            if [ "${CHANNEL}" = "stable" ]; then
              app=run.suite.shell
              branch=master
            else
              app=run.suite.slop.shell
              branch="${CHANNEL}"
            fi
            commit_file=".dev/release/suite-shell-${CHANNEL}.commit"
            test -s "${commit_file}"
            expected="$(cat "${commit_file}")"
          else
            # A rehearsal published nothing, so the only ref it can prove is
            # what the public remote serves on the stable branch today. No
            # build published means nothing to install, and that is a skip.
            app=run.suite.shell
            branch=master
            if ! flatpak remote-ls --user suite --app \
              --columns=application,branch \
              | awk -v app="${app}" -v branch="${branch}" \
                '$1 == app && $2 == branch { found = 1 } END { exit !found }'; then
              echo "rehearsal: the public remote has no ${app}//${branch}; skipping the clean install"
              exit 0
            fi
          fi
          ref="${app}//${branch}"

          flatpak install --user --noninteractive -y suite "${ref}"

          installed_ref="$(flatpak info --user --show-ref "${app}" "${branch}")"
          installed_commit="$(flatpak info --user --show-commit "${app}" "${branch}")"
          wanted_ref="app/${app}/$(flatpak --default-arch)/${branch}"
          echo "installed ${installed_ref} at ${installed_commit}"
          if [ "${installed_ref}" != "${wanted_ref}" ]; then
            echo "expected the ${wanted_ref} branch, installed ${installed_ref}" >&2
            exit 1
          fi
          if [ -n "${expected}" ] && [ "${installed_commit}" != "${expected}" ]; then
            echo "the installed commit is ${installed_commit}, but ${commit_file} says ${expected}" >&2
            exit 1
          fi

          # The commit has to run, not just exist. A window that is still up
          # after 25s is a pass: `timeout` kills it and exits 124.
          #
          # A hosted runner has no session bus, and zypak aborts Electron
          # without one ("Failed to connect to session bus", exit 134), so the
          # launch would fail on the environment rather than on the build.
          # `platforms.yml` wraps its smoke test the same way.
          log="${work}/launch.log"
          status=0
          xvfb-run -a dbus-run-session -- timeout 25 flatpak run --branch="${branch}" "${app}" \
            >"${log}" 2>&1 || status=$?
          if [ "${status}" -ne 0 ] && [ "${status}" -ne 124 ]; then
            echo "flatpak run ${ref} exited ${status} before the timeout" >&2
            cat "${log}" >&2
            exit 1
          fi
          echo "clean install verified: ${installed_ref} at ${installed_commit} launched (exit ${status})"

      - name: Publish the drafts and write RELEASES.md
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: node scripts/release-status.mjs --publish --channel "${CHANNEL}"

      # Nightly is frequent; keep the Releases page readable. Stable and preview
      # are never pruned.
      - name: Prune old nightly releases
        if: inputs.publish && inputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-status.mjs --prune --channel nightly --keep 14

      - name: Upload the artifacts
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-${{ inputs.channel }}-release
          path: |
            .dev/release/suite-apps.spdx.json
            .dev/release/release-manifest.json
            .dev/release/suite-shell-${{ inputs.channel }}.commit
            .dev/release/suite-shell-${{ inputs.channel }}.flatpak
            ${{ steps.apk.outputs.path }}
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

      # A release with no pack stages no index and prints the skip sentence
      # above. Skip this artifact rather than fail a publication on files that
      # correctly do not exist; a run that staged an index still demands them.
      - name: Upload the catalogue index artifacts
        if: inputs.publish && hashFiles('.dev/release/index.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-${{ inputs.channel }}-catalogue-index
          path: |
            .dev/release/index.json
            .dev/release/index.json.sig
            .dev/release/index-release.json
            .dev/release/packs/*.suitepack
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
