# Suite Canvas as a Flatpak.
#
# Build the unpacked app first, then let this manifest package it:
#
#   pnpm --filter @suite/canvas-desktop run package:dir
#   node scripts/flatpak.mjs
#
# The manifest packages what electron-builder produced rather than rebuilding it
# inside flatpak-builder. The renderer and the shell are built by the same gate
# the other artifact forms use, and the sandbox should not carry a second pnpm
# and a network build. `org.electronjs.Electron2.BaseApp` supplies zypak, which
# gives Electron its sandbox without a setuid chrome-sandbox.
app-id: run.suite.canvas
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: run.suite.canvas
separate-locales: false

finish-args:
  - --share=ipc
  # Canvas syncs documents between peers; the AppImage has the same reach.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Only the suite's own folder: Canvas writes `Documents/Suite/Canvas`, and
  # nothing above it is reachable. `:create` lets the first launch make the
  # folder.
  - --filesystem=xdg-documents/Suite:create
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: suite-canvas
    buildsystem: simple
    build-commands:
      - mkdir -p /app/canvas
      - cp -a app/. /app/canvas/
      - install -Dm755 run.suite.canvas /app/bin/run.suite.canvas
      - install -Dm644 run.suite.canvas.desktop /app/share/applications/run.suite.canvas.desktop
      - install -Dm644 run.suite.canvas.metainfo.xml /app/share/metainfo/run.suite.canvas.metainfo.xml
      - install -Dm644 icons/run.suite.canvas-48.png /app/share/icons/hicolor/48x48/apps/run.suite.canvas.png
      - install -Dm644 icons/run.suite.canvas-64.png /app/share/icons/hicolor/64x64/apps/run.suite.canvas.png
      - install -Dm644 icons/run.suite.canvas-128.png /app/share/icons/hicolor/128x128/apps/run.suite.canvas.png
      - install -Dm644 icons/run.suite.canvas-256.png /app/share/icons/hicolor/256x256/apps/run.suite.canvas.png
      - install -Dm644 icons/run.suite.canvas-512.png /app/share/icons/hicolor/512x512/apps/run.suite.canvas.png
    sources:
      - type: dir
        path: ../../apps/canvas/desktop/release/linux-unpacked
        dest: app
      - type: file
        path: run.suite.canvas
      - type: file
        path: run.suite.canvas.desktop
      - type: file
        path: run.suite.canvas.metainfo.xml
      - type: dir
        path: icons
        dest: icons
