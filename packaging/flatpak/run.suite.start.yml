# Suite Start as a Flatpak.
#
# Build the unpacked app first, then let this manifest package it:
#
#   pnpm --filter @suite/start run package:dir
#   node scripts/flatpak.mjs --app start
#
# The manifest packages what electron-builder produced rather than rebuilding it
# inside flatpak-builder. The renderer and the shell are built by the same gate
# the other artifact forms use, and the sandbox should not carry a second pnpm
# and a network build. `org.electronjs.Electron2.BaseApp` supplies zypak, which
# gives Electron its sandbox without a setuid chrome-sandbox.
#
# Start is the hub: it installs, updates, opens and removes Suite apps, so its
# sandbox is wider than an app's. The grants below are exactly that surface —
# the folders a desktop reads, the folders Start owns, and the host's Flatpak
# service. It never holds a document, so documents stay read-only.
app-id: run.suite.start
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: run.suite.start
separate-locales: false

finish-args:
  # Chromium's browser and renderer processes share memory through this.
  - --share=ipc
  # Native Wayland first, with X11 as the fallback for an X11 session.
  - --socket=wayland
  - --socket=fallback-x11
  # GPU acceleration for the window; without it Electron renders in software.
  - --device=dri
  # Deliberate host escape: the hub manages Flatpaks with `flatpak-spawn --host`,
  # which is effectively host command execution. A sandboxed package manager
  # needs the host's own Flatpak, and this is the only grant that reaches it.
  - --talk-name=org.freedesktop.Flatpak
  # Older folder copies live here; `:create` lets a first launch make the folder.
  - --filesystem=~/Applications/Suite:create
  # Shortcut entries and their icons are files a desktop reads, not the hub.
  - --filesystem=xdg-data/applications:create
  - --filesystem=xdg-data/icons:create
  # Start's own update state and the apps' per-app data live under this folder.
  - --filesystem=xdg-data/suite:create
  # The hub's own records belong to Start, and to no app.
  - --filesystem=xdg-config/suite:create
  # The hub routes documents to an app; it may read one to find its owner, never write.
  - --filesystem=xdg-documents:ro

modules:
  - name: suite-start
    buildsystem: simple
    build-commands:
      - mkdir -p /app/start
      - cp -a app/. /app/start/
      # Electron's XDG application id and WM_CLASS come from package.json's
      # `desktopName`, so the BaseApp helper rewrites the asar copy to the
      # Flatpak id. Without it Wayland groups the window under `suite-start`.
      - patch-desktop-filename /app/start/resources/app.asar
      - install -Dm755 run.suite.start /app/bin/run.suite.start
      - install -Dm644 run.suite.start.desktop /app/share/applications/run.suite.start.desktop
      - install -Dm644 run.suite.start.metainfo.xml /app/share/metainfo/run.suite.start.metainfo.xml
      - install -Dm644 icons/run.suite.start-48.png /app/share/icons/hicolor/48x48/apps/run.suite.start.png
      - install -Dm644 icons/run.suite.start-64.png /app/share/icons/hicolor/64x64/apps/run.suite.start.png
      - install -Dm644 icons/run.suite.start-128.png /app/share/icons/hicolor/128x128/apps/run.suite.start.png
      - install -Dm644 icons/run.suite.start-256.png /app/share/icons/hicolor/256x256/apps/run.suite.start.png
      - install -Dm644 icons/run.suite.start-512.png /app/share/icons/hicolor/512x512/apps/run.suite.start.png
    sources:
      - type: dir
        path: ../../apps/start/release/linux-unpacked
        dest: app
      - type: file
        path: run.suite.start
      - type: file
        path: run.suite.start.desktop
      - type: file
        path: run.suite.start.metainfo.xml
      - type: dir
        path: icons
        dest: icons
