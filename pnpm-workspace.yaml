packages:
  - "hosts/*"
  - "hosts/*/packages/*"
  - "legacy/*"
  - "legacy/*/*"
  - "legacy/*/packages/*"
  - "packs/*"
  - "services/*"
  - "services/*/*"
  - "services/*/packages/*"
  - "packages/*"
  - "site"

# Shared packages are workspace packages. A local edit is the one that builds.
linkWorkspacePackages: true

allowBuilds:
  esbuild: true
  electron: true
  # Only electron-builder's Windows installer target reaches this. The Suite
  # builds an unsigned Windows test zip, never an NSIS installer.
  electron-winstaller: false

packageExtensions:
  # Canvas installs @vitest/browser-playwright for its Storybook tests, while
  # jest-dom's own peer set otherwise resolves a second Vitest instance. Two
  # copies means its `declare module 'vitest'` augments the copy the app does
  # not use, and every jest-dom matcher loses its type. Declaring the peer here
  # keeps one Vitest.
  "@testing-library/jest-dom":
    peerDependencies:
      "@vitest/browser-playwright": "*"

overrides:
  # One @types/node across the workspace keeps pnpm from creating a second
  # Vitest peer variant, which breaks module augmentation (see packageExtensions).
  "@types/node": 26.6.6
  lodash-es: ^4.18.1
  qs: ^6.17.0
  nanoid@3: 3.3.20
  nanoid@4: 5.1.16
  katex: ^0.18.2
  # GHSA advisories in build-only tooling: glob and minimatch are reached by
  # electron-builder, Storybook's docgen plugin and Stryker, never by a shipped
  # bundle. Each selector names the vulnerable range only, so a package that
  # needs an older API line keeps it.
  "glob@>=9.0.0 <=14.0.1": 14.0.6
  "minimatch@>=7.0.0 <11.0.1": 11.0.9

patchedDependencies:
  loro-prosemirror@0.4.4: legacy/canvas/patches/loro-prosemirror@0.4.4.patch
  "@stryker-mutator/vitest-runner@10.0.0": legacy/canvas/patches/@stryker-mutator__vitest-runner@10.0.0.patch
