appId: run.suite.help
productName: Suite Help
executableName: suite-help
artifactName: suite-help-${version}-${arch}.${ext}
copyright: Copyright © Suite contributors

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json
  # Production payload only. Nothing below is loaded by any process: source maps
  # and declarations are for editors, and changelogs and other registry markdown
  # are not shipped. The renderer is already one Vite bundle in `out/`.
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.d.cts"
  - "!**/CHANGELOG*"
  - "!**/*.md"
  # A dependency's licence and notice must travel with it. Electron-builder takes
  # the last matching pattern, so these re-include what the `.md` negation drops.
  - "**/README*"
  - "**/LICENSE*"
  - "**/NOTICE*"
  - "**/COPYING*"
  - "**/LICENCE*"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/__tests__/**"
  - "!**/*.test.*"
  - "!**/*.spec.*"
  # Help's main process requires `electron` and `node:*` only; the preload
  # requires `electron` only. Every package in `dependencies` is renderer-only
  # and is already bundled into `out/renderer`, and `fumadocs-mdx`'s esbuild
  # toolchain runs during the build, never from the app. The whole
  # `node_modules` tree and its unpacked native binaries are dead weight, so
  # this exclusion is last: it also wins over the licence re-includes above,
  # which would otherwise pull NOTICE files back out of dependencies Help does
  # not load.
  - "!node_modules/**"

asar: true

# The switches an attacker cannot turn back on after packaging.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

extraResources:
  - from: resources
    to: .
  - from: resources/icon.png
    to: icon.png
# The hub discovers an app by the manifest beside its executable.
extraFiles:
  - from: suite.app.json
    to: suite.app.json

linux:
  syncDesktopName: true
  # The same headset mark as the window, the hub's card and the Flatpak entry.
  icon: resources/icon.png
  # Help ships through Flatpak. A local unpacked build is enough to package it;
  # there is no other Linux artifact and nothing to publish from this config.
  target:
    - dir
  category: Documentation

mac:
  target:
    - dmg
  category: public.app-category.reference

win:
  target:
    - nsis
