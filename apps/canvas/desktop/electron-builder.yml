# The Canvas desktop build.
#
# Linux ships as a Flatpak. `scripts/flatpak.mjs` packages this unpacked build,
# so `dir` is the only target configured here. The `.canvas` association is
# declared by `fileAssociations` and `linux.desktop.entry`, which Flatpak's
# exported desktop entry keeps. Canvas claims no URL scheme of its own:
# `suite://` belongs to Start, which routes a link by launching this app with it.
#
# macOS and Windows are configured but cannot be produced here: both need a
# signing identity this repository does not have, and an unsigned build is not
# something to hand a user.
appId: run.suite.canvas
productName: Suite Canvas
copyright: Copyright © Suite

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  # Production payload only. `tsc` emits declarations and maps for the shell it
  # compiles; no process loads them, and changelogs and other registry markdown
  # are not shipped. `resources/renderer` is extraResources and keeps its content
  # as built.
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.d.cts"
  - "!**/CHANGELOG*"
  - "!**/*.md"
  # A dependency's licence and notice must travel with it. Electron-builder takes
  # the last matching pattern, so these re-include what the `.md` negation drops.
  - "**/README*"
  - "**/LICENSE*"
  - "**/NOTICE*"
  - "**/COPYING*"
  - "**/LICENCE*"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/__tests__/**"
  - "!**/*.test.*"
  - "!**/*.spec.*"
  # Dependency files no process loads. Loro's Node loader is `nodejs/` and the
  # renderer's wasm is already emitted into `out/renderer`; `browser/`,
  # `bundler/`, `web/` and `base64/` are alternative entry points nothing
  # requires. Zod's root entry loads `v4/classic` and `v4/core` only: `src/` is
  # TypeScript source and v3/v4-mini are entry points this app never imports.
  # Rollup's native addon is a build-time dependency of the bundler, and
  # `@types/` is declarations. Verified against the packaged main/preload
  # require graph: none of these paths is reachable.
  - "!node_modules/loro-crdt/browser/**"
  - "!node_modules/loro-crdt/bundler/**"
  - "!node_modules/loro-crdt/web/**"
  - "!node_modules/loro-crdt/base64/**"
  - "!node_modules/zod/src/**"
  - "!node_modules/zod/v3/**"
  - "!node_modules/zod/v4-mini/**"
  - "!node_modules/zod/mini/**"
  - "!node_modules/zod/v4/mini/**"
  - "!node_modules/@rollup/**"
  - "!node_modules/@types/**"
extraResources:
  - from: ../dist
    to: renderer
  # The window's own icon: a desktop entry reads the theme, but `_NET_WM_ICON` — what a
  # panel draws in the taskbar — comes from `BrowserWindow({ icon })` and nothing else.
  - from: build/icon.png
    to: icon.png
# Start discovers an app by the manifest beside its executable, so this lands
# next to the binary rather than in resources.
extraFiles:
  - from: suite.app.json
    to: suite.app.json

asar: true

# The window's own icon travels beside the asar: a desktop entry reads the hicolor theme,
# but a running window's taskbar icon is `_NET_WM_ICON`, which Chromium fills only when
# `BrowserWindow` is handed an image.


# Fuses are the switches an attacker cannot turn back on after packaging:
# without them, a modified binary can be told to run any Node script.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Every page is served from a custom protocol now, so file:// needs no extra privileges.
  grantFileProtocolExtraPrivileges: false

linux:
  syncDesktopName: true
  target:
    - dir
  # Without this the binary is named after the package, which for a scoped name
  # becomes `@suitedesktop`. The executable name is part of what Start records,
  # so it has to be a name a person would recognise.
  executableName: suite-canvas
  category: Office
  icon: build/icons
  synopsis: A local-first canvas for connected thinking
  description: Cards, boards and writing in one document that works offline and lives in a file you own.
  desktop:
    entry:
      MimeType: application/x-suite-canvas;
      StartupWMClass: Suite Canvas

mac:
  category: public.app-category.productivity
  target:
    - dmg

win:
  target:
    - nsis

fileAssociations:
  - ext: canvas
    name: Suite Canvas Workspace
    description: A Suite Canvas workspace
    role: Editor
    mimeType: application/x-suite-canvas

# No per-app scheme: Start owns `suite://` and routes to the app. A second
# scheme nothing registers or handles is a promise the app does not keep.
