appId: run.suite.budget
productName: Suite Budget
executableName: suite-budget
copyright: Copyright © Suite contributors

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json
  # Production payload only. Nothing below is loaded by any process: source maps
  # and declarations are for editors, and changelogs and other registry markdown
  # are not shipped. The renderer is already one Vite bundle in `out/`.
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.d.cts"
  - "!**/CHANGELOG*"
  - "!**/*.md"
  # A dependency's licence and notice must travel with it. Electron-builder takes
  # the last matching pattern, so these re-include what the `.md` negation drops.
  - "**/README*"
  - "**/LICENSE*"
  - "**/NOTICE*"
  - "**/COPYING*"
  - "**/LICENCE*"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/__tests__/**"
  - "!**/*.test.*"
  - "!**/*.spec.*"
  # Dependency files no process loads. Loro's Node loader is `nodejs/` and the
  # renderer's wasm is already emitted into `out/renderer`; `browser/`,
  # `bundler/`, `web/` and `base64/` are alternative entry points nothing
  # requires. Zod's root entry loads `v4/classic` and `v4/core` only: `src/` is
  # TypeScript source and v3/v4-mini are entry points this app never imports.
  # Rollup's native addon is a build-time dependency of the bundler, and
  # `@types/` is declarations. Verified against the packaged main/preload
  # require graph: none of these paths is reachable.
  - "!node_modules/loro-crdt/browser/**"
  - "!node_modules/loro-crdt/bundler/**"
  - "!node_modules/loro-crdt/web/**"
  - "!node_modules/loro-crdt/base64/**"
  - "!node_modules/zod/src/**"
  - "!node_modules/zod/v3/**"
  - "!node_modules/zod/v4-mini/**"
  - "!node_modules/zod/mini/**"
  - "!node_modules/zod/v4/mini/**"
  - "!node_modules/@rollup/**"
  - "!node_modules/@types/**"

asar: true

# The switches an attacker cannot turn back on after packaging.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Every page is served from a custom protocol now, so file:// needs no extra privileges.
  grantFileProtocolExtraPrivileges: false

extraResources:
  - from: resources
    to: .
  # The window's own icon: a desktop entry reads the theme, but `_NET_WM_ICON` — what a
  # panel draws in the taskbar — comes from `BrowserWindow({ icon })` and nothing else.
  - from: resources/icon.png
    to: icon.png
# The hub discovers an app by the manifest beside its executable, so this lands next to the
# binary rather than in resources.
extraFiles:
  - from: suite.app.json
    to: suite.app.json

fileAssociations:
  - ext: budget
    name: Suite Budget
    description: A Suite Budget file
    role: Editor
    mimeType: application/x-suite-budget

linux:
  syncDesktopName: true
  # Linux ships as a Flatpak. `scripts/flatpak.mjs` packages this unpacked build,
  # so `dir` is the only target configured here.
  target:
    - dir
  category: Office

mac:
  target:
    - dmg
  category: public.app-category.finance

win:
  target:
    - nsis
