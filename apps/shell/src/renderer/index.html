<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Suite</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body data-surface="launcher">
    <header class="tabbar">
      <button id="home" class="brand" type="button" title="Home" aria-label="Home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Suite</span>
      </button>
      <div id="tabs" class="tabs" role="tablist" aria-label="Open tabs"></div>
      <button id="new-tab" class="new-tab" type="button" title="Home" aria-label="Open Home">
        +
      </button>
    </header>

    <main class="content">
      <section id="screen" class="screen" aria-label="Screen">
        <header class="screen-head">
          <div class="screen-title">
            <p class="eyebrow">Screen</p>
            <h1 id="screen-name">Home</h1>
          </div>
          <button id="edit-toggle" class="edit-toggle" type="button" aria-pressed="false">
            Edit
          </button>
        </header>

        <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>

        <div id="edit-bar" class="edit-bar" hidden>
          <div class="edit-add">
            <label for="widget-choice">Add widget</label>
            <select id="widget-choice"></select>
            <button id="add-widget" class="action action-primary" type="button">Add</button>
          </div>
          <p class="hint">
            Keys on a widget: ↑ earlier · ↓ later · ← smaller · → larger · Delete removes.
          </p>
        </div>

        <div id="widgets" class="widgets"></div>
      </section>

      <section id="empty" class="empty-state">
        <p class="eyebrow">One window, many apps</p>
        <h1>Nothing is open</h1>
        <p class="lede">
          Home shows the packs on this device and the widgets they declare. Each pack runs in its
          own sandbox and keeps its own documents; the shell never reads them.
        </p>
        <button id="open-home" class="install" type="button">Open Home</button>
      </section>
    </main>

    <script type="module" src="shell.js"></script>
  </body>
</html>
