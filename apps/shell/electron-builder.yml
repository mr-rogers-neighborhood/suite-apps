# The host's own package.
#
# One installed app per OS. Packs are data, not resources: a packaged build loads
# only verified installs under the user's data directory. Unsigned development
# directories beside the checkout are never packed into the app.
appId: run.suite.shell
# The public name is Suite Desk. productName stays Suite so the data directory
# (`~/.config/Suite`, and the sandbox's copy) does not move with the rename.
productName: Suite
executableName: suite
copyright: Copyright © Suite contributors

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.d.cts"
  - "!**/CHANGELOG*"
  - "!**/*.md"
  - "**/README*"
  - "**/LICENSE*"
  - "**/NOTICE*"
  - "**/COPYING*"
  - "**/LICENCE*"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/__tests__/**"
  - "!**/*.test.*"
  - "!**/*.spec.*"
  - "!node_modules/zod/src/**"
  - "!node_modules/zod/v3/**"
  - "!node_modules/zod/v4-mini/**"
  - "!node_modules/zod/mini/**"
  - "!node_modules/zod/v4/mini/**"
  - "!node_modules/@types/**"

asar: true

# Loro's Node build loads a WebAssembly file through the filesystem. Keeping the
# package unpacked makes that a real file rather than an asar read, which is the
# conservative choice while the shell is a spike.
asarUnpack:
  - node_modules/loro-crdt/**

electronLanguages:
  - en-US

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

# A zip, not NSIS: the Windows build is an unsigned test artifact, and an
# installer would imply a signing and update story this tree does not have yet.
win:
  target:
    - zip

linux:
  target:
    - dir
  category: Utility
  synopsis: Suite Desk — the desktop Suite host
  description: "Suite Desk: one window that opens sandboxed Suite packs as tabs."
