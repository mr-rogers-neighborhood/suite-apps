apply plugin: 'com.android.application'

// Supplied by scripts/android.mjs from app.config.json, so the APK, the JS package and the config
// cannot disagree. The defaults keep a bare `./gradlew` working without the script. Bound to locals
// rather than inlined: the Groovy DSL reads an inline `?:` inside `defaultConfig` as part of the
// property call and reports the result as "Value is null".
def suiteVersionCode = (project.findProperty("suiteVersionCode") ?: "3") as Integer
def suiteVersionName = (project.findProperty("suiteVersionName") ?: "0.2.0").toString()

// The channel identity table. `scripts/android-release.mjs` owns the same numbers and the artifact
// names; it reads the built APK back with `aapt` and refuses a package id or versionCode that does
// not match, so this table and the script cannot drift silently. Stable keeps the id a shipped
// install already has. Each pre-release channel has its own id, so stable, slop, nightly and preview
// install and update side by side and each has its own data tree; the channel is in the display
// name and the id, not only the branch.
//
// versionCode = base x 10 + channel digit. The digit is fixed per channel, so bumping the base in
// app.config.json always increases the code within a channel. Each id grows on its own sequence:
// promotion installs a second app rather than updating a shared pre-release id. The rule is in
// hosts/go/docs/reference/android.md.
def channelDigits = [stable: 0, slop: 1, nightly: 2, preview: 3]
def channelIds = [
    stable: "run.suite.go",
    slop: "run.suite.slop.go",
    nightly: "run.suite.nightly.go",
    preview: "run.suite.preview.go",
]

android {
    namespace = "run.suite.go"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId channelIds.stable
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode suiteVersionCode * 10
        versionName suiteVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // A release build is signed with a key that never enters this repository: the four values come
    // from the environment, and a missing one fails the build with a sentence rather than producing
    // an unsigned APK that looks finished. `scripts/android-release.mjs` is the only caller that
    // sets them; the debug build does not need any of this and keeps the machine's debug keystore.
    signingConfigs {
        if (System.getenv("SUITE_GO_KEYSTORE") != null) {
            release {
                storeFile file(System.getenv("SUITE_GO_KEYSTORE"))
                storePassword System.getenv("SUITE_GO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SUITE_GO_KEY_ALIAS")
                keyPassword System.getenv("SUITE_GO_KEY_PASSWORD")
            }
        }
    }
    flavorDimensions += "channel"
    productFlavors {
        stable {
            dimension "channel"
            applicationId channelIds.stable
            versionCode suiteVersionCode * 10 + channelDigits.stable
        }
        slop {
            dimension "channel"
            applicationId channelIds.slop
            versionCode suiteVersionCode * 10 + channelDigits.slop
            versionNameSuffix "-slop"
        }
        nightly {
            dimension "channel"
            applicationId channelIds.nightly
            versionCode suiteVersionCode * 10 + channelDigits.nightly
            versionNameSuffix "-nightly"
        }
        preview {
            dimension "channel"
            applicationId channelIds.preview
            versionCode suiteVersionCode * 10 + channelDigits.preview
            versionNameSuffix "-preview"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("SUITE_GO_KEYSTORE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
